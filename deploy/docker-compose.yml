name: faleme

services:
  faleme:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8100:8100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
